<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Motion video</title>
<!--
  A motion video as one HTML page. Every frame is a pure function of time:
  window.renderAt(t) sets every style from t, with no CSS transitions, timers or
  randomness. That is what lets record.mjs capture it frame by frame and get the
  same video every time, and lets you jump to any moment with `--stills`.

  Open this file in a browser to preview in real time (?theme=light for the light skin).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400&family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@400;600&display=block" rel="stylesheet">
<style>
  :root {
    /* Yuma palette — values owned by the yuma-design-system skill */
    --earth: #c4a892; --fgreen: #21e467; --forest: #005d46; --purple: #6434da; --pink: #eba9ff;
    /* theme tokens: dark by default, ?theme=light overrides them. Style with tokens, never raw colours. */
    --bg: #0a0f0d; --stage: radial-gradient(1200px 800px at 70% 30%, #0d2a22 0%, #0a0f0d 60%);
    --text: #fff; --muted: rgba(255,255,255,.55); --faint: rgba(255,255,255,.5); --soft: rgba(255,255,255,.8);
    --accent: #21e467; --strike: #eba9ff;
    --surface: rgba(255,255,255,.05); --line: rgba(255,255,255,.12); --shadow: none;
    --pill-bg: rgba(0,0,0,.6); --logo-filter: invert(1);
  }
  :root[data-theme="light"] {
    --bg: #f8f5f5; --stage: radial-gradient(1200px 800px at 70% 30%, #ffffff 0%, #f0ece9 70%);
    --text: #000; --muted: rgba(0,0,0,.58); --faint: rgba(0,0,0,.34); --soft: rgba(0,0,0,.78);
    --accent: #005d46; --strike: #6434da;
    --surface: #fff; --line: rgba(0,0,0,.1); --shadow: 0 8px 28px rgba(0,0,0,.07);
    --pill-bg: rgba(255,255,255,.94); --logo-filter: none;
  }
  /* the outro sits on the Forest Green Yuma background in both themes */
  #outro { --text: #fff; --muted: rgba(255,255,255,.55); --accent: #21e467; color: #fff; }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
  body { font-family: Inter, Arial, sans-serif; font-weight: 300; color: var(--text); }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--stage); }
  #bg { position: absolute; inset: 0; }
  .scene { position: absolute; inset: 0; opacity: 0; }
  .abs { position: absolute; }
  .serif { font-family: Merriweather, 'Times New Roman', serif; font-weight: 300; } /* BogueSlab Thin when licensed */
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  .eyebrow { font-size: 22px; letter-spacing: .32em; text-transform: uppercase; color: var(--accent); font-weight: 600; }

  #title h1 { position: absolute; left: 0; right: 0; top: 330px; text-align: center; font-size: 150px; }
  #title p { position: absolute; left: 0; right: 0; top: 590px; text-align: center; font-size: 46px; }
  #title em { font-style: normal; color: var(--accent); }

  .stmt { position: absolute; left: 0; right: 0; text-align: center; font-size: 120px; }
  .strike { position: absolute; height: 6px; background: var(--strike); transform-origin: left; }

  .card { position: absolute; width: 380px; height: 128px; border-radius: 16px; padding: 22px 26px;
    background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); }
  .card .t { font-size: 28px; font-weight: 400; margin-bottom: 6px; } .card .s { font-size: 22px; color: var(--muted); }
  .card .dot { position: absolute; right: 22px; top: 22px; width: 14px; height: 14px; border-radius: 50%; }
  [data-theme="light"] .card .dot { box-shadow: 0 0 0 1.5px rgba(0,0,0,.28); } /* pink and earth fills are faint on beige */
  .logo { filter: var(--logo-filter); } /* for a black logo image: white on dark, untouched on light */
  .cap { position: absolute; left: 0; right: 0; bottom: 48px; text-align: center; }
  .cap span { display: inline-block; padding: 14px 32px; border-radius: 999px; background: var(--pill-bg);
    border: 1px solid var(--line); box-shadow: var(--shadow); font-family: Merriweather, serif; font-size: 31px; }

  #outro { background: var(--forest) url(assets/yuma-bg-title-green.png) center/cover; }
  #outro h1 { position: absolute; left: 160px; top: 300px; font-size: 130px; }
  #cta { position: absolute; left: 160px; top: 560px; font-size: 34px; padding: 22px 34px; border-radius: 14px;
    background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.2); white-space: pre; }
  #outro p { position: absolute; left: 160px; top: 690px; font-size: 32px; color: rgba(255,255,255,.85); }
  #yuma { position: absolute; left: 160px; bottom: 100px; height: 96px; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg"></canvas>

  <section class="scene" id="title">
    <h1 class="serif">Product</h1>
    <p class="serif">One line that says what it is, <em>and why it matters.</em></p>
  </section>

  <section class="scene" id="statement">
    <div id="st1" class="stmt serif" style="top:300px;color:var(--faint)"><span id="st1t">The old way.</span></div>
    <div id="stStrike" class="strike" style="top:385px"></div>
    <div id="st2" class="stmt serif" style="top:520px">The <span style="color:var(--accent)">new</span> way.</div>
  </section>

  <section class="scene" id="cards">
    <div class="abs" style="left:0;right:0;top:80px;text-align:center">
      <div class="eyebrow">What you get</div>
      <div class="serif" style="font-size:56px;margin-top:14px">The headline states the takeaway.</div>
    </div>
    <div id="grid"></div>
    <div id="caps"></div>
  </section>

  <section class="scene" id="outro">
    <h1 class="serif">Product</h1>
    <div id="cta" class="mono"></div>
    <p class="serif">The one thing to do next.</p>
    <img id="yuma" src="assets/Yuma_logo_White-RGB.svg" alt="Yuma">
  </section>
</div>

<script>
const DURATION = 26;
const LIGHT = new URLSearchParams(location.search).get('theme') === 'light';
document.documentElement.dataset.theme = LIGHT ? 'light' : 'dark';

/* ---------- helpers: everything is derived from t ---------- */
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));           // 0→1 between a and b
const lerp = (a, b, x) => a + (b - a) * x;
const eo = x => 1 - Math.pow(1 - x, 3);                         // ease out: things arriving
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; // ease in-out: camera, travel
const eback = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); }; // pop
function style(el, o, { x = 0, y = 0, s = 1 } = {}) { el.style.opacity = o; el.style.transform = `translate(${x}px, ${y}px) scale(${s})`; }
// palette for JS-drawn things; on light, bright green and lavender are swapped for their readable brand colours
const C = LIGHT ? { green: '#005d46', lav: '#6434da', pink: '#eba9ff', earth: '#c4a892' }
                : { green: '#21e467', lav: '#9b7cf5', pink: '#eba9ff', earth: '#c4a892' };

/* ---------- scenes: [id, start, end]. Neighbours overlap by ~0.4 s and fade through the background.
   Each scene function receives the time since ITS OWN start, so moving, shortening or reordering a
   scene is an edit to this list only. (narration.json and music.py use absolute video time.) ---------- */
const SCENES = [['title', 0, 5.4], ['statement', 5.0, 10.4], ['cards', 10.0, 20.4], ['outro', 20.0, 26.01]];
const sceneWin = (t, a, b, f = .6) => Math.min(prog(t, a, a + f), 1 - prog(t, b - f, b));
const startOf = id => SCENES.find(s => s[0] === id)[1];

/* ---------- background: a drifting network, deterministic (positions are functions of t) ---------- */
const bg = $('bg'), g = bg.getContext('2d');
{ const dpr = window.devicePixelRatio || 1; // draw at device resolution so 4K renders stay sharp
  bg.width = 1920 * dpr; bg.height = 1080 * dpr; bg.style.width = '1920px'; bg.style.height = '1080px'; g.scale(dpr, dpr); }
const P = Array.from({ length: 70 }, (_, i) => {
  const r = k => { const v = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return v - Math.floor(v); };
  return { x: r(1) * 1920, y: r(2) * 1080, ax: 40 + r(3) * 90, ay: 30 + r(4) * 80, fx: .05 + r(5) * .12, fy: .04 + r(6) * .1, ph: r(7) * 6.28, c: r(8) };
});
function drawBg(t) {
  g.clearRect(0, 0, 1920, 1080);
  const k = 1 - prog(t, startOf('outro'), startOf('outro') + .8); // fades out under the outro
  const reveal = eo(prog(t, 0, 2.5)), rgb = LIGHT ? '0,93,70' : '33,228,103';
  const pts = P.map(p => [p.x + Math.sin(t * p.fx * 6.28 + p.ph) * p.ax, p.y + Math.cos(t * p.fy * 6.28 + p.ph) * p.ay, p.c]);
  for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) {
    const d = Math.hypot(pts[i][0] - pts[j][0], pts[i][1] - pts[j][1]);
    if (d < 230) { g.strokeStyle = `rgba(${rgb},${(1 - d / 230) * (LIGHT ? .12 : .16) * reveal * k})`; g.lineWidth = 1;
      g.beginPath(); g.moveTo(pts[i][0], pts[i][1]); g.lineTo(pts[j][0], pts[j][1]); g.stroke(); }
  }
  for (const [x, y] of pts) { g.fillStyle = `rgba(${rgb},${(LIGHT ? .3 : .5) * reveal * k})`; g.beginPath(); g.arc(x, y, 2.2, 0, 6.29); g.fill(); }
}

/* ---------- title ---------- */
function title(t) {
  const a = eo(prog(t, .6, 2.0)); style($('title').querySelector('h1'), a, { y: lerp(40, 0, a), s: lerp(1.06, 1, a) });
  const b = eo(prog(t, 2.2, 3.4)); style($('title').querySelector('p'), b, { y: lerp(30, 0, b) });
}

/* ---------- statement: the old idea is struck through, the new one replaces it ---------- */
function statement(t) {
  const sp = $('st1t'), strike = $('stStrike');           // the line is measured, so it always fits the text
  strike.style.left = sp.offsetLeft - 16 + 'px'; strike.style.width = sp.offsetWidth + 32 + 'px';
  const a = eo(prog(t, .4, 1.4)); style($('st1'), a, { y: lerp(40, 0, a) });
  const s = eio(prog(t, 1.8, 2.5)); strike.style.transform = `scaleX(${s})`; strike.style.opacity = s > 0 ? 1 : 0;
  const b = eo(prog(t, 2.6, 3.6)); style($('st2'), b, { y: lerp(40, 0, b), s: lerp(.94, 1, b) });
}

/* ---------- cards: data lives in a plain list, the DOM is built once, renderAt only styles it ---------- */
const CARDS = [['First', 'what it does', C.green], ['Second', 'what it does', C.lav], ['Third', 'what it does', C.pink], ['Fourth', 'what it does', C.earth],
               ['Fifth', 'what it does', C.green], ['Sixth', 'what it does', C.lav], ['Seventh', 'what it does', C.pink], ['Eighth', 'what it does', C.earth]];
$('grid').innerHTML = CARDS.map(([n, s, c], i) =>
  `<div class="card" style="left:${150 + (i % 4) * 410}px;top:${330 + Math.floor(i / 4) * 158}px"><span class="dot" style="background:${c}"></span><div class="t">${n}</div><div class="s">${s}</div></div>`).join('');
const CAPS = [[1.2, 5.0, 'A caption says what the picture is showing.'], [5.2, 9.8, 'Keep it to one short sentence.']]; // start, end (scene time), text
$('caps').innerHTML = CAPS.map(([, , txt]) => `<div class="cap"><span>${txt}</span></div>`).join('');
function cards(t) {
  [...$('grid').children].forEach((el, i) => {
    const d = (i % 4) * .12 + Math.floor(i / 4) * .22, a = eo(prog(t, .6 + d, 1.3 + d));
    el.style.opacity = a; el.style.transform = `perspective(900px) rotateX(${lerp(-80, 0, a)}deg) translateY(${lerp(30, 0, a)}px)`;
  });
  [...$('caps').children].forEach((el, i) => {
    const [a, b] = CAPS[i]; style(el, Math.min(eo(prog(t, a, a + .4)), 1 - prog(t, b - .35, b)), { y: lerp(14, 0, eo(prog(t, a, a + .4))) });
  });
}

/* ---------- outro ---------- */
const CTA = 'the command or URL to act on';
const CTA_PROMPT = '$'; // a shell prompt for a command; use '›' or '' for a date, a URL or a plain call to action
function outro(t) {
  const a = eo(prog(t, .6, 1.7)); style($('outro').querySelector('h1'), a, { y: lerp(40, 0, a) });
  const n = clamp(Math.floor((t - 1.6) * 28), 0, CTA.length); // typed out
  $('cta').innerHTML = `<span style="color:var(--accent)">${CTA_PROMPT}</span> ${CTA.slice(0, n)}`; $('cta').style.opacity = t > 1.4 ? 1 : 0;
  const b = eo(prog(t, 3.2, 4.0)); style($('outro').querySelector('p'), b, { y: lerp(20, 0, b) }); style($('yuma'), b);
}

const RENDER = { title, statement, cards, outro };
window.renderAt = function (t) {
  drawBg(t);
  for (const [id, a, b] of SCENES) {
    const el = $(id), w = sceneWin(t, a, b);
    el.style.display = w > 0 ? 'block' : 'none';
    if (w <= 0) continue;
    el.style.opacity = w;
    RENDER[id](t - a); // scene-local time
  }
};
window.DURATION = DURATION;

// live preview when opened in a browser (the recorder passes ?render)
if (!location.search.includes('render')) {
  const fit = () => { const k = Math.min(innerWidth / 1920, innerHeight / 1080);
    document.body.style.cssText = 'width:100vw;height:100vh;background:#000;display:flex;align-items:center;justify-content:center';
    $('stage').style.transform = `scale(${k})`; $('stage').style.flex = 'none'; };
  addEventListener('resize', fit); fit();
  let start = null;
  document.fonts.ready.then(() => requestAnimationFrame(function loop(ts) {
    if (start === null) start = ts;
    renderAt(((ts - start) / 1000) % DURATION);
    requestAnimationFrame(loop);
  }));
}
</script>
</body>
</html>
